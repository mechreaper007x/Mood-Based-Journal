spring.application.name=moodjournal

# Local development defaults to file-backed H2. Production should provide PostgreSQL
# through SPRING_DATASOURCE_URL / USERNAME / PASSWORD.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/moodjournal;AUTO_SERVER=FALSE;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
server.port=${PORT:9092}

# Keep schema updates for compatibility with the existing project. Introduce versioned
# migrations before changing this in a production database.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.properties.hibernate.format_sql=true

# Secrets must be supplied by the environment; never commit real values here.
google.api.key=${GOOGLE_API_KEY:}
gemini.api.key=${google.api.key}
google.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent
mistral.api.key=${MISTRAL_API_KEY:}
mistral.api.url=https://api.mistral.ai/v1/chat/completions
mistral.model=open-mistral-7b

jwt.secret=${JWT_SECRET}
jwt.rotation.minutes=30
jwt.fingerprint.enabled=true

password.reset.token.expiry.minutes=30
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Email is opt-in. Set APP_EMAIL_ENABLED=true and SPRING_MAIL_PASSWORD to enable it.
app.email.enabled=${APP_EMAIL_ENABLED:false}
spring.mail.host=smtp.resend.com
spring.mail.port=587
spring.mail.username=resend
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.transport.protocol=smtp

# IMPORTANT: supply the EXISTING key during the first deployment to preserve access
# to previously encrypted journal entries. Rotate only after a verified data migration.
app.encryption.key=${APP_ENCRYPTION_KEY}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://mood-based-journal-1.onrender.com}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
