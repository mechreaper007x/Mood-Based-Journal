databases:
  - name: moodjournal-db
    databaseName: moodjournal
    user: mooduser
    plan: free

services:
  - type: web
    name: moodjournal-backend
    runtime: docker
    rootDir: moodjournal/moodjournal/backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: moodjournal-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: moodjournal-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: moodjournal-db
          property: password
      - key: SPRING_JPA_DATABASE_PLATFORM
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: GOOGLE_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: APP_EMAIL_ENABLED
        value: "false"
      - key: FRONTEND_URL
        value: https://mood-based-journal-1.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://mood-based-journal-1.onrender.com

  - type: web
    name: moodjournal-frontend
    runtime: static
    rootDir: moodjournal/moodjournal/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://mood-based-journal.onrender.com/api
